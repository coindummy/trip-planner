<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Planner – Liste testi</title>
<style>
  :root { --bg:#faf7f2; --ink:#222; --muted:#777; --accent:#e4572e; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:.95rem; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px; font-size:16px; border:1px solid #ddd; border-radius:10px; }
  button { padding:12px 16px; font-size:16px; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  #status { margin:16px 0; color:var(--muted); }
  ul { list-style:none; padding:0; margin:0; }
  li { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  li b { display:block; }
  li small { color:var(--muted); }
  li a { color:var(--accent); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Kaydedilenler listesi testi</h1>
  <p class="sub">Google Maps'te listeyi aç → Paylaş → linki buraya yapıştır.</p>
  <form id="f">
    <input id="u" type="url" placeholder="https://maps.app.goo.gl/..." required>
    <button>Getir</button>
  </form>
  <div id="status"></div>
  <ul id="list"></ul>
</main>
<script>
  const f = document.getElementById('f');
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('list');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  f.addEventListener('submit', async e => {
    e.preventDefault();
    listEl.innerHTML = '';
    statusEl.textContent = 'Liste getiriliyor…';
    try {
      const r = await fetch('/api/list?url=' + encodeURIComponent(document.getElementById('u').value.trim()));
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      statusEl.textContent = `${d.title || 'Liste'} · ${d.count} yer`;
      listEl.innerHTML = d.places.map(p => `
        <li><b>${esc(p.name)}</b>
          <small>${esc(p.address)}</small><br>
          <small>${p.lat ?? '?'}, ${p.lng ?? '?'}</small>
          ${p.lat != null ? `<br><a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank">Haritada aç</a>` : ''}
        </li>`).join('');
    } catch (err) {
      statusEl.textContent = 'Hata: ' + err.message;
    }
  });
</script>
</body>
</html>
